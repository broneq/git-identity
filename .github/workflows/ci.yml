name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `pnpm run <script>` rather than `pnpm exec <tool>`: the extra process
      # layer in `exec` has been seen to die under memory pressure.
      - run: pnpm run check
      - run: pnpm run typecheck
      - run: pnpm run test
